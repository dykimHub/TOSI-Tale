spring:
  application:
    name: tale
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_URL}:3306/tale?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    hikari:
      idle-timeout: 300000
      max-lifetime: 1800000
    properties:
      hibernate:
        format_sql: true
    show_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
    output:
      ansi.enabled: always
    servlet:
      multipart:
        max-file-size: 1GB
        max-request-size: 1GB
  data:
    redis:
      port: 6379
      host: ${REDIS_URL}
logging:
  level:
    org.springframework.data.redis.cache: DEBUG
cloud:
  aws:
    s3:
      bucket: ${BUCKET_NAME}
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
service:
  user:
    url: ${API_HOST}/api/users
springdoc:
  title: Tosi API
  api-docs:
    path: /docs/tales
  swagger-ui:
    urls:
      - name: 동화
        url: ${API_HOST}/docs/tales
      - name: 회원
        url: ${API_HOST}/docs/users
      - name: 커스텀 동화
        url: ${API_HOST}/docs/custom-tales
      - name: 채팅
        url: ${API_HOST}/docs/chat
# 쿠버네티스 프로브(liveness/readiness) 엔드포인트 노출
management:
  endpoints: # endpoint's'
    web:
      base-path: /actuator/tales
  endpoint: # endpoint
    health:
      probes:
        enabled: true
